# PR と main への push で、手元の scripts/dev/check.sh と同じ検査を実行する。
#
# - AWS には接続しない（認証情報を渡していない）。apply は CI では行わない。
# - 使う Actions は、タグではなくコミット SHA で固定している。
#   タグは後から別のコミットに付け替えられるため（2026年3月の trivy-action の事例）。
# - ツールの版は、手元（scripts/dev/install-*.sh）と同じにしている。
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.17.2"
  TFLINT_VERSION: "v0.66.0"
  CHECKOV_VERSION: "3.4.11"
  ANSIBLE_CORE_VERSION: "2.22.0"
  ANSIBLE_LINT_VERSION: "26.11.1"
  GITLEAKS_VERSION: "8.30.1"
  PYTHON_VERSION: "3.13"

jobs:
  terraform:
    name: Terraform (fmt / validate / tflint / checkov)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform

      - name: terraform validate
        run: |
          for dir in terraform/bootstrap terraform/envs/dev; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint
        env:
          # プラグインの取得で GitHub の API を使うので、回数制限に当たらないようにする
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --chdir=terraform --recursive --config "$PWD/.tflint.hcl"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: checkov
        run: |
          pip install --quiet "checkov==${CHECKOV_VERSION}"
          checkov --config-file .checkov.yaml

  ansible:
    name: Ansible (syntax check / ansible-lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Ansible と ansible-lint を入れる
        run: pip install --quiet "ansible-core==${ANSIBLE_CORE_VERSION}" "ansible-lint==${ANSIBLE_LINT_VERSION}"

      - name: コレクションを入れる
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml -p collections

      - name: 構文チェック
        working-directory: ansible
        # 構文の確認は AWS に接続しなくてよいので、空のインベントリで実行する
        run: |
          ansible-playbook -i localhost, --syntax-check site.yml
          ansible-playbook -i localhost, --syntax-check zabbix-config.yml

      - name: ansible-lint
        working-directory: ansible
        run: ansible-lint --offline

  app:
    name: Omikuji API (unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # サーバー（Amazon Linux 2023）の Python と同じ系統で確かめる
          python-version: "3.9"

      - name: テスト
        run: python -m unittest discover -s app/omikuji -v

      - name: 監視と障害注入のスクリプトの構文
        run: python -m py_compile scripts/dev/zabbix_api.py scripts/dev/zabbix_viewer.py scripts/fault-injection/run_test.py

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 過去のコミットも調べるので、履歴をすべて取る
          fetch-depth: 0

      - name: gitleaks を入れる（チェックサムを照合）
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          rm -f gitleaks_*
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: gitleaks（履歴全体）
        run: gitleaks git --no-banner --redact --verbose .
