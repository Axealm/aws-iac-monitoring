---
- name: PostgreSQL を読み込み直す
  ansible.builtin.systemd_service:
    name: postgresql
    state: reloaded

- name: Zabbix サーバーを再起動する
  ansible.builtin.systemd_service:
    name: zabbix-server
    state: restarted

- name: Php-fpm を再起動する
  ansible.builtin.systemd_service:
    name: php-fpm
    state: restarted

- name: Nginx を再起動する
  ansible.builtin.systemd_service:
    name: nginx
    state: restarted
