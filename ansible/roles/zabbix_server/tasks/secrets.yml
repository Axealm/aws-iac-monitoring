---
# パスワードは、リポジトリにも平文のファイルにも置かない。
# 初回だけランダムな値を作って SSM Parameter Store（SecureString）に保存し、2回目以降はそれを読む。
# この処理は、サーバーではなく Ansible を実行している PC から AWS の API を呼ぶ。

- name: パスワードがすでに保存されているかを調べる
  ansible.builtin.set_fact:
    zabbix_server_secret_exists: >-
      {{ (zabbix_server_secret_exists | default({})) | combine({item:
         (lookup('amazon.aws.ssm_parameter', item, region=aws_region, on_missing='skip') | default('', true) | length > 0)}) }}
  loop: "{{ zabbix_server_secret_names }}"
  no_log: true

# すでにある場合は作り直さない（毎回変わると冪等にならない）
- name: パスワードがなければ作って SSM Parameter Store に保存する
  ansible.builtin.command:
    argv:
      - aws
      - ssm
      - put-parameter
      - --region
      - "{{ aws_region }}"
      - --name
      - "{{ item }}"
      - --type
      - SecureString
      - --description
      - Managed by Ansible (aws-iac-monitoring)
      - --value
      - "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
      - --no-overwrite
  loop: "{{ zabbix_server_secret_names }}"
  when: not zabbix_server_secret_exists[item]
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  changed_when: true
  no_log: true

- name: SSM Parameter Store からパスワードを読む
  ansible.builtin.set_fact:
    zabbix_server_db_password: "{{ lookup('amazon.aws.ssm_parameter', zabbix_server_ssm_db_password, region=aws_region) }}"
    zabbix_server_admin_password: "{{ lookup('amazon.aws.ssm_parameter', zabbix_server_ssm_admin_password, region=aws_region) }}"
  no_log: true
