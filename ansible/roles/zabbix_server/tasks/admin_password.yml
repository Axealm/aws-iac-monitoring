---
# Zabbix を入れた直後の管理者パスワードは、公開されている初期値になっている。
# SSM Parameter Store に保存したランダムな値へ変更する。
# まず新しいパスワードでログインを試し、通ればすでに変更済みなので何もしない。

- name: 新しいパスワードでログインできるかを調べる
  ansible.builtin.uri:
    url: "{{ zabbix_server_api_url }}"
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      method: user.login
      params:
        username: "{{ zabbix_server_admin_user }}"
        password: "{{ zabbix_server_admin_password }}"
      id: 1
  register: zabbix_server_login_new
  changed_when: false
  no_log: true

- name: 初期パスワードから変更する（まだ変更していない場合だけ）
  when: zabbix_server_login_new.json.result is not defined
  block:
    - name: 初期パスワードでログインする
      ansible.builtin.uri:
        url: "{{ zabbix_server_api_url }}"
        method: POST
        body_format: json
        body:
          jsonrpc: "2.0"
          method: user.login
          params:
            username: "{{ zabbix_server_admin_user }}"
            password: "{{ zabbix_server_admin_initial_password }}"
            userData: true
          id: 1
      register: zabbix_server_login_initial
      failed_when: zabbix_server_login_initial.json.result is not defined
      changed_when: false
      no_log: true

    - name: 管理者のパスワードを変更する
      ansible.builtin.uri:
        url: "{{ zabbix_server_api_url }}"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ zabbix_server_login_initial.json.result.sessionid }}"
        body:
          jsonrpc: "2.0"
          method: user.update
          params:
            userid: "{{ zabbix_server_login_initial.json.result.userid }}"
            current_passwd: "{{ zabbix_server_admin_initial_password }}"
            passwd: "{{ zabbix_server_admin_password }}"
          id: 2
      register: zabbix_server_passwd_update
      failed_when: zabbix_server_passwd_update.json.result is not defined
      changed_when: true
      no_log: true
